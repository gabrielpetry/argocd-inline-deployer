name: Publish OCI chart

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: chart-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.19.0
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(helm show chart . | awk '$1 == "version:" {print $2}')"
          if [[ "$RELEASE_TAG" != "v${version}" ]]; then
            echo "Release tag $RELEASE_TAG must match Chart.yaml version v${version}" >&2
            exit 1
          fi
      - name: Test chart
        run: bash tests/test-chart.sh
      - name: Build chart
        run: helm package . --destination dist
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish chart
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          helm push dist/*.tgz "oci://ghcr.io/${OWNER,,}"
      - name: Log out
        if: always()
        run: helm registry logout ghcr.io
